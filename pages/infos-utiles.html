<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infos utiles - Suivi voyage Madagascar</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<main class="page">
  <section class="hero">
    <div class="eyebrow">Infos utiles</div>
    <h1>Infos utiles</h1>
    <p>Rappels pratiques, règles véhicule, enfants et points à garder sous la main.</p>
  </section>
  
<section class="nav-card">
  <div class="grid-3">
    <a data-nav class="nav-item" href="../index.html"><strong>Accueil</strong></a>
    <a data-nav class="nav-item" href="./convertisseur.html"><strong>Convertisseur</strong></a>
    <a data-nav class="nav-item" href="./depenses.html"><strong>Dépenses</strong></a>
    <a data-nav class="nav-item" href="./feuille-de-route.html"><strong>Feuille de route</strong></a>
    <a data-nav class="nav-item" href="./reservations.html"><strong>Réservations</strong></a>
    <a data-nav class="nav-item" href="./infos-utiles.html"><strong>Infos utiles</strong></a>
  </div>
</section>


  <section class="panel">
    <div class="day-top" style="margin-bottom:12px">
      <h2 class="section-title" style="margin:0">Liste</h2>
      <div class="header-actions">
        <button type="button" class="btn btn-primary" id="addInfoBtn">+ Ajouter</button>
        <button type="button" class="btn btn-secondary" id="resetInfosBtn">Réinitialiser</button>
      </div>
    </div>
    <div class="note" style="margin-bottom:10px">Les modifications sont sauvegardées localement sur cet appareil.</div>
    <div id="infosList" class="list"></div>
  </section>
  <div class="page-footer">Infos utiles • <span data-current-year></span></div>
</main>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const STORAGE_KEY = 'suivi-app2.infos-utiles.v1';
  const container = document.getElementById('infosList');
  const addBtn = document.getElementById('addInfoBtn');
  const resetBtn = document.getElementById('resetInfosBtn');
  let initialData = [];
  let data = [];

  const escapeHtml = (value) => String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function loadSaved() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(saved)) return saved;
    } catch (_) {}
    return null;
  }

  function render() {
    container.innerHTML = data.map((item, index) => `
      <article class="item" data-index="${index}">
        <label>Catégorie</label>
        <input data-field="categorie" value="${escapeHtml(item.categorie)}" placeholder="Urgence, Voyage, Enfants…" />
        <label>Titre</label>
        <input data-field="titre" value="${escapeHtml(item.titre)}" placeholder="Titre" />
        <label>Contenu</label>
        <textarea data-field="contenu" rows="4" placeholder="Information utile">${escapeHtml(item.contenu)}</textarea>
        <div class="header-actions" style="margin-top:10px">
          <span class="badge badge-upcoming">${escapeHtml(item.categorie || 'Info')}</span>
          <button type="button" class="btn btn-warning" data-delete="${index}">Supprimer</button>
        </div>
      </article>
    `).join('');
  }

  try {
    const res = await fetch('../assets/data/infos-utiles.json');
    initialData = await res.json();
  } catch {
    initialData = [];
  }

  data = loadSaved() || JSON.parse(JSON.stringify(initialData));
  render();

  container.addEventListener('input', (event) => {
    const field = event.target.dataset.field;
    if (!field) return;
    const card = event.target.closest('[data-index]');
    if (!card) return;
    data[Number(card.dataset.index)][field] = event.target.value;
    save();
  });

  container.addEventListener('click', (event) => {
    const index = event.target.dataset.delete;
    if (index === undefined) return;
    if (!confirm('Supprimer cette information ?')) return;
    data.splice(Number(index), 1);
    save();
    render();
  });

  addBtn.addEventListener('click', () => {
    data.unshift({ categorie: 'Info', titre: '', contenu: '' });
    save();
    render();
  });

  resetBtn.addEventListener('click', () => {
    if (!confirm('Réinitialiser les infos utiles avec les données de départ ?')) return;
    data = JSON.parse(JSON.stringify(initialData));
    save();
    render();
  });
});
</script>

<script src="../assets/js/app.js"></script>
</body>
</html>
